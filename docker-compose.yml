services:

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ishaab 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: llmgateway 
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  backend:
    build:
      context: ./backend
      target: dev
    ports:
      - "2727:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    secrets:
      - ollama_api_key
      - openrouter_api_key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - redis
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - grafana-data:/var/lib/grafana

  caddy:
    image: caddy:2
    ports:
      - "80:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./frontend/dist:/srv          # built SPA served by Caddy (run `npm run build` first)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend


volumes:
  pgdata:
  grafana-data:


secrets:
  ollama_api_key:
    file: ./secrets/ollama_api_key.txt
  openrouter_api_key:
    file: ./secrets/openrouter_api_key.txt