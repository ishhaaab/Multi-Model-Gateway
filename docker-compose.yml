services:

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ishaab 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: llmgateway 
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  backend:
    build:
      context: ./backend
      target: dev
    ports:
      # loopback-only (S2): Caddy on :80 is the only ingress for the tailnet;
      # 2727 stays reachable from the host for dev/docs but not from LAN devices.
      - "127.0.0.1:2727:8000"
    volumes:
      - ./backend:/app
      - training_data:/app/training_data
      # host ComfyUI models/loras folder (or a local default) so trained LoRAs
      # written by the API land where ComfyUI can load them
      - ${COMFY_LORA_DIR:-./comfy-loras}:/comfy-loras
    env_file:
      - .env
    secrets:
      - openrouter_api_key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - redis
    # For GPU-aware fit scoring (/v1/hardware, /v1/cookbook) give the backend
    # GPU access (needs nvidia-container-toolkit); without it the endpoints
    # degrade to cpu_only verdicts:
    gpus: all

  # deep-research job worker (arq, Redis broker)
  worker:
    build:
      context: ./backend
      target: dev
    command: arq app.worker.WorkerSettings
    volumes:
      - ./backend:/app
    env_file:
      - .env
    secrets:
      - openrouter_api_key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - redis

  # image-LoRA training worker (ai-toolkit); GPU required
  trainer:
    build:
      context: ./backend
      target: trainer
    command: arq app.trainer_worker.WorkerSettings
    volumes:
      - ./backend:/app
      - training_data:/app/training_data
      # HF download cache (safety checker etc.) persists across container recreates
      - hf_cache:/root/.cache/huggingface
      # SDXL_MODEL_PATH is the host folder holding your local SDXL model for
      # training; the trainer looks for SDXL_MODEL_NAME inside it (or uses
      # /models/sdxl directly when SDXL_MODEL_NAME is empty). Unset var defaults
      # to ./comfy-checkpoints — an empty dir Docker will create (gitignored).
      - ${SDXL_MODEL_PATH:-./comfy-checkpoints}:/models/sdxl
      # SD1_MODEL_PATH is the host folder holding your local SD1 model for
      # training; the trainer looks for SD1_MODEL_NAME inside it (or uses
      # /models/sd1 directly when SD1_MODEL_NAME is empty). Unset var defaults
      # to ./comfy-checkpoints — an empty dir Docker will create (gitignored).
      - ${SD1_MODEL_PATH:-./comfy-checkpoints}:/models/sd1
    env_file:
      - .env
    secrets:
      - openrouter_api_key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - redis
    gpus: all

  # optional self-hosted search for web_search + deep research:
  # start with `docker compose --profile search up` and set
  # SEARXNG_URL=http://searxng:8080 in .env (otherwise DuckDuckGo is used)
  searxng:
    image: searxng/searxng
    profiles: ["search"]
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      # bearer token for the gated /metrics endpoint (written by setup scripts)
      - ./monitoring/metrics_token:/etc/prometheus/metrics_token:ro

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - grafana-data:/var/lib/grafana

  caddy:
    image: caddy:2
    ports:
      - "80:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./frontend/dist:/srv          # built SPA served by Caddy (run `npm run build` first)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend


volumes:
  pgdata:
  grafana-data:
  training_data:
  hf_cache:


secrets:
  openrouter_api_key:
    file: ./secrets/openrouter_api_key.txt