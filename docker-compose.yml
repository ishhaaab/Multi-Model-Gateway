services:

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ishaab 
      POSTGRES_PASSWORD: ishaab27
      POSTGRES_DB: llmgateway 
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  backend:
    build: ./backend
    ports:
      - "2727:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - redis

volumes:
  pgdata: 