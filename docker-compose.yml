services:

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  backend:
    build:
      context: ./backend
      target: dev
    ports:
      # loopback-only (S2): Caddy on :80 is the only ingress for the tailnet;
      # 2727 stays reachable from the host for dev/docs but not from LAN devices.
      - "127.0.0.1:2727:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    secrets:
      - openrouter_api_key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - redis
    # For GPU-aware fit scoring (/v1/hardware, /v1/cookbook) give the backend
    # GPU access (needs nvidia-container-toolkit); without it the endpoints
    # degrade to cpu_only verdicts:
    gpus: all

  # deep-research job worker (arq, Redis broker)
  worker:
    build:
      context: ./backend
      target: dev
    command: arq app.worker.WorkerSettings
    volumes:
      - ./backend:/app
    env_file:
      - .env
    secrets:
      - openrouter_api_key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - redis

  # optional self-hosted search for web_search + deep research:
  # start with `docker compose --profile search up` and set
  # SEARXNG_URL=http://searxng:8080 in .env (otherwise DuckDuckGo is used)
  searxng:
    image: searxng/searxng
    profiles: ["search"]
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/

  prometheus:
    image: prom/prometheus
    ports:
      # loopback-only (S-B): the tailnet reaches Grafana/Prometheus through
      # Caddy on :80 if ever needed; 9090 stays available on the host only.
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      # bearer token for the gated /metrics endpoint (written by setup scripts)
      - ./monitoring/metrics_token:/etc/prometheus/metrics_token:ro

  grafana:
    image: grafana/grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - grafana-data:/var/lib/grafana

  caddy:
    image: caddy:2
    ports:
      - "80:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./frontend/dist:/srv          # built SPA served by Caddy (run `npm run build` first)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend


volumes:
  pgdata:
  grafana-data:


secrets:
  openrouter_api_key:
    file: ./secrets/openrouter_api_key.txt
